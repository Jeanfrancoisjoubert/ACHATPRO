
<script>
const CART_STORAGE_KEY = "achatpro_cart_v2";

let cart = [];

try {
  cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || "[]");
  if (!Array.isArray(cart)) cart = [];
} catch (error) {
  cart = [];
}

function saveCart() {
  localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
}

function requestProduct(product) {
  document.getElementById("requestedProduct").value = product;
  document.getElementById("demande").scrollIntoView({
    behavior: "smooth"
  });
}

function filterCategory(category) {
  document.querySelectorAll(".product-card").forEach(card => {
    card.classList.toggle(
      "hidden",
      card.dataset.category !== category
    );
  });
}

function searchProducts() {
  const query = document.getElementById("searchInput")
    .value.toLowerCase().trim();

  document.querySelectorAll(".product-card").forEach(card => {
    card.classList.toggle(
      "hidden",
      !card.innerText.toLowerCase().includes(query)
    );
  });

  document.getElementById("produits").scrollIntoView({
    behavior: "smooth"
  });
}

function addToCart(product) {
  const existing = cart.find(item => item.name === product);

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({
      name: product,
      qty: 1
    });
  }

  saveCart();
  updateCart();

  alert(product + " ajouté au panier.");
}

function changeQuantity(index, change) {
  cart[index].qty += change;

  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }

  saveCart();
  updateCart();
}

function removeFromCart(index) {
  cart.splice(index, 1);
  saveCart();
  updateCart();
}

function clearCart() {
  if (confirm("Voulez-vous vraiment vider votre panier ?")) {
    cart = [];
    saveCart();
    updateCart();
  }
}

function updateCart() {
  const count = document.getElementById("cartCount");
  const area = document.getElementById("cartItems");

  count.innerText = cart.reduce(
    (total, item) => total + item.qty,
    0
  );

  if (cart.length === 0) {
    area.innerText = "Votre panier est vide.";
    return;
  }

  area.innerHTML = "";

  cart.forEach((item, index) => {
    const line = document.createElement("div");

    line.style.cssText =
      "display:flex;justify-content:space-between;" +
      "align-items:center;gap:10px;flex-wrap:wrap;" +
      "padding:12px 0;border-bottom:1px solid #ddd";

    const name = document.createElement("span");
    name.textContent = item.name + " × " + item.qty;

    const controls = document.createElement("div");
    controls.style.cssText =
      "display:flex;gap:6px;flex-wrap:wrap";

    const minus = document.createElement("button");
    minus.className = "btn btn-outline";
    minus.textContent = "−";
    minus.onclick = () => changeQuantity(index, -1);

    const plus = document.createElement("button");
    plus.className = "btn btn-outline";
    plus.textContent = "+";
    plus.onclick = () => changeQuantity(index, 1);

    const remove = document.createElement("button");
    remove.className = "btn btn-outline";
    remove.textContent = "Retirer";
    remove.onclick = () => removeFromCart(index);

    controls.append(minus, plus, remove);
    line.append(name, controls);
    area.appendChild(line);
  });

  const emptyButton = document.createElement("button");
  emptyButton.className = "btn btn-outline";
  emptyButton.textContent = "Vider le panier";
  emptyButton.style.marginTop = "12px";
  emptyButton.onclick = clearCart;

  area.appendChild(emptyButton);
}

function checkout() {
  if (cart.length === 0) {
    alert("Votre panier est vide.");
    return;
  }

  document.getElementById("requestedProduct").value =
    cart.map(item =>
      item.name + " (quantité: " + item.qty + ")"
    ).join(", ");

  document.getElementById("demande").scrollIntoView({
    behavior: "smooth"
  });
}

function checkCoupon() {
  const code = document.getElementById("couponInput")
    .value.trim();

  const message = document.getElementById("couponMessage");
  message.style.display = "block";

  message.textContent = code
    ? "Le code sera vérifié par notre service lors de l'activation du système promotionnel."
    : "Veuillez entrer un code promotionnel.";
}

function copyReferral() {
  const code = document.getElementById("referralCode").innerText;

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(() => {
      alert("Code copié : " + code);
    }).catch(() => {
      alert("Votre code : " + code);
    });
  } else {
    alert("Votre code : " + code);
  }
}

/* Ajouter les boutons panier aux cartes */
document.querySelectorAll(".product-card").forEach(card => {
  const heading = card.querySelector("h3");

  if (!heading) return;

  const product = heading.textContent.trim();

  const button = document.createElement("button");
  button.className = "btn btn-gold";
  button.textContent = "Ajouter au panier";
  button.style.marginTop = "10px";
  button.onclick = () => addToCart(product);

  card.appendChild(button);
});

/* Formulaire de demande */
document.getElementById("purchaseForm").addEventListener(
  "submit",
  function(event) {
    event.preventDefault();

    const data = new FormData(this);
    const message = document.getElementById("formMessage");

    message.style.display = "block";
    message.textContent =
      "Votre demande de démonstration est prête. " +
      "Le système d'envoi sera connecté lors de la prochaine étape. " +
      "Aucune commande réelle n'a été envoyée.";

    console.log(
      "Demande de démonstration :",
      Object.fromEntries(data)
    );
  }
);

/* Restaurer le panier */
updateCart();
</script>
